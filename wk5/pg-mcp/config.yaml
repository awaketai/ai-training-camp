# PostgreSQL MCP Server 配置文件

# 数据库连接配置
databases:
  # 小型博客数据库
  - name: "blog_small"
    host: "127.0.0.1"
    port: 5432
    database: "blog_small"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"  # 从环境变量读取
    ssl_mode: "disable"
    read_only: true
    min_pool_size: 2
    max_pool_size: 10
    connect_timeout: 10.0
    command_timeout: 30.0

  # 中型电商数据库
  - name: "ecommerce_medium"
    host: "127.0.0.1"
    port: 5432
    database: "ecommerce_medium"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
    ssl_mode: "disable"
    read_only: true
    min_pool_size: 2
    max_pool_size: 10

  # 大型ERP数据库
  - name: "erp_large"
    host: "127.0.0.1"
    port: 5432
    database: "erp_large"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
    ssl_mode: "disable"
    read_only: true
    min_pool_size: 2
    max_pool_size: 10

# OpenAI 配置
openai:
  api_key: "${OPENAI_API_KEY}"
  base_url: "${OPENAI_BASE_URL}"  # 使用默认 API 地址，或设置为兼容接口
  model: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 2048
  timeout: 30.0

# SQL 校验器配置
validator:
  max_subquery_depth: 3
  max_join_tables: 5
  default_limit: 1000
  max_limit: 10000
  blocked_schemas:
    - "pg_catalog"
    - "information_schema"
    - "pg_toast"

# 结果验证器配置
verifier:
  enabled: false
  max_rows_to_verify: 10

# 日志配置
log_level: "INFO"
log_format: "console"  # 或 "json"
