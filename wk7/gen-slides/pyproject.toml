[project]
name = "gen-slides"
version = "0.1.0"
description = "GenSlides - AI-powered presentation generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "pyyaml>=6.0.3",
    "blake3>=1.0.8",
    "google-genai>=1.60.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.21",
]

[project.scripts]
gen-slides = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
